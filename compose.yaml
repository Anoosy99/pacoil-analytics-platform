services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pacoil
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: local-demo-only
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d pacoil"]
      interval: 5s
      retries: 10
  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://demo:local-demo-only@db:5432/pacoil
      DEMO_PASSWORD: ${DEMO_PASSWORD:-pacoil-demo}
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
